# Enhanced theme.properties demonstrating script registration API
parent=base
import=common/keycloak

# Traditional script loading (backwards compatible)
scripts=js/legacy-script.js js/traditional-module.js

# New script registration examples can be done in templates using:
# ${registerScript('my-module', 'js/my-module.js', 'module', 'head')}
# ${registerScript('my-script', 'js/my-script.js', 'classic', 'footer')}
# ${enqueueScript('my-module')}
# ${enqueueScript('my-script')}

# Theme styles (unchanged)
styles=css/login.css css/theme-styles.css

# Security features
# Content Security Policy can be configured here
# csp=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'

# Dark mode support
darkMode=false